services:
  aurora:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api}
    image: aurora-app:local
    restart: unless-stopped
    ports:
      - "${HOST_PORT:-7860}:${PORT:-7860}"
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: ${PORT:-7860}
      ENABLE_STARTUP_WARMUP: ${ENABLE_STARTUP_WARMUP:-false}
      CORS_ORIGIN: ${CORS_ORIGIN:-}
      FORMATOS_BASE_URL: ${FORMATOS_BASE_URL:-}
      AUTH_LOCAL_ADMIN_ENABLED: ${AUTH_LOCAL_ADMIN_ENABLED:-false}
      AUTH_LOCAL_ADMIN_USERNAME: ${AUTH_LOCAL_ADMIN_USERNAME:-}
      AUTH_LOCAL_ADMIN_PASSWORD: ${AUTH_LOCAL_ADMIN_PASSWORD:-}
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET:-}
      AUTH_TOKEN_TTL: ${AUTH_TOKEN_TTL:-8h}
      AUTH_REMEMBER_TOKEN_TTL: ${AUTH_REMEMBER_TOKEN_TTL:-7d}
      AUTH_TOKEN_ISSUER: ${AUTH_TOKEN_ISSUER:-aurora}
      AUTH_TOKEN_AUDIENCE: ${AUTH_TOKEN_AUDIENCE:-aurora-api}
      AZURE_AD_TENANT_ID: ${AZURE_AD_TENANT_ID:-}
      AZURE_AD_CLIENT_ID: ${AZURE_AD_CLIENT_ID:-}
      AZURE_AD_ALLOWED_EMAIL_DOMAINS: ${AZURE_AD_ALLOWED_EMAIL_DOMAINS:-}
      AZURE_AD_REQUIRED_GROUP_IDS: ${AZURE_AD_REQUIRED_GROUP_IDS:-}
      AZURE_AD_REQUIRED_APP_ROLES: ${AZURE_AD_REQUIRED_APP_ROLES:-}
      ORACLE_USER: ${ORACLE_USER:-}
      ORACLE_PASSWORD: ${ORACLE_PASSWORD:-}
      ORACLE_HOST: ${ORACLE_HOST:-}
      ORACLE_PORT: ${ORACLE_PORT:-1521}
      ORACLE_SERVICE_NAME: ${ORACLE_SERVICE_NAME:-}
      ORACLE_SCHEMA: ${ORACLE_SCHEMA:-}
      ORACLE_GESTION_ID_SEQUENCE: ${ORACLE_GESTION_ID_SEQUENCE:-}
      ORACLE_POOL_MIN: ${ORACLE_POOL_MIN:-1}
      ORACLE_POOL_MAX: ${ORACLE_POOL_MAX:-8}
      ORACLE_POOL_INCREMENT: ${ORACLE_POOL_INCREMENT:-1}
      ORACLE_POOL_TIMEOUT: ${ORACLE_POOL_TIMEOUT:-60}
