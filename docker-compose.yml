services:
  aurora:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api}
    image: aurora-app:local
    restart: unless-stopped
    ports:
      - "${HOST_PORT:-443}:${PORT:-7860}"
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: ${PORT:-7860}
      ENABLE_STARTUP_WARMUP: ${ENABLE_STARTUP_WARMUP:-true}
      HTTPS_KEY_PATH: ${HTTPS_KEY_PATH:-}
      HTTPS_CERT_PATH: ${HTTPS_CERT_PATH:-}
      CORS_ORIGIN: ${CORS_ORIGIN:-}
      AUTH_LOCAL_ADMIN_ENABLED: ${AUTH_LOCAL_ADMIN_ENABLED:-false}
      AUTH_LOCAL_ADMIN_USERNAME: ${AUTH_LOCAL_ADMIN_USERNAME:-}
      AUTH_LOCAL_ADMIN_PASSWORD: ${AUTH_LOCAL_ADMIN_PASSWORD:-}
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET:-}
      AUTH_TOKEN_TTL: ${AUTH_TOKEN_TTL:-8h}
      AUTH_REMEMBER_TOKEN_TTL: ${AUTH_REMEMBER_TOKEN_TTL:-7d}
      AUTH_TOKEN_ISSUER: ${AUTH_TOKEN_ISSUER:-aurora}
      AUTH_TOKEN_AUDIENCE: ${AUTH_TOKEN_AUDIENCE:-aurora-api}
      AUTH_USER_ACCESS_MODE: ${AUTH_USER_ACCESS_MODE:-open}
      AUTH_BOOTSTRAP_ADMIN_EMAILS: ${AUTH_BOOTSTRAP_ADMIN_EMAILS:-}
      AUTH_USER_STORE_PATH: ${AUTH_USER_STORE_PATH:-/app/backend/storage/auth/auth-users.json}
      AUTH_USER_IMPORT_MAX_MB: ${AUTH_USER_IMPORT_MAX_MB:-2}
      AUTH_USER_IMPORT_MAX_ROWS: ${AUTH_USER_IMPORT_MAX_ROWS:-5000}
      AUTH_USER_SYNC_REQUIRED: ${AUTH_USER_SYNC_REQUIRED:-false}
      AURORA_VIDEOS_DIR: ${AURORA_VIDEOS_DIR:-/app/backend/tutorial-videos}
      LDAP_ENABLED: ${LDAP_ENABLED:-false}
      LDAP_URL: ${LDAP_URL:-}
      LDAP_DOMAIN: ${LDAP_DOMAIN:-defensoria.gov.co}
      LDAP_ALLOWED_EMAIL_DOMAINS: ${LDAP_ALLOWED_EMAIL_DOMAINS:-defensoria.gov.co}
      LDAP_TIMEOUT_MS: ${LDAP_TIMEOUT_MS:-8000}
      AZURE_AD_TENANT_ID: ${AZURE_AD_TENANT_ID:-}
      AZURE_AD_CLIENT_ID: ${AZURE_AD_CLIENT_ID:-}
      AZURE_AD_ALLOWED_EMAIL_DOMAINS: ${AZURE_AD_ALLOWED_EMAIL_DOMAINS:-}
      AZURE_AD_REQUIRED_GROUP_IDS: ${AZURE_AD_REQUIRED_GROUP_IDS:-}
      AZURE_AD_REQUIRED_APP_ROLES: ${AZURE_AD_REQUIRED_APP_ROLES:-}
      AZURE_AD_ADMIN_GROUP_IDS: ${AZURE_AD_ADMIN_GROUP_IDS:-}
      ORACLE_USER: ${ORACLE_USER:-}
      ORACLE_PASSWORD: ${ORACLE_PASSWORD:-}
      ORACLE_HOST: ${ORACLE_HOST:-}
      ORACLE_PORT: ${ORACLE_PORT:-1521}
      ORACLE_SERVICE_NAME: ${ORACLE_SERVICE_NAME:-}
      ORACLE_SCHEMA: ${ORACLE_SCHEMA:-}
      ORACLE_GESTION_ID_SEQUENCE: ${ORACLE_GESTION_ID_SEQUENCE:-}
      ORACLE_POOL_MIN: ${ORACLE_POOL_MIN:-1}
      ORACLE_POOL_MAX: ${ORACLE_POOL_MAX:-8}
      ORACLE_POOL_INCREMENT: ${ORACLE_POOL_INCREMENT:-1}
      ORACLE_POOL_TIMEOUT: ${ORACLE_POOL_TIMEOUT:-60}
      AURORA_CARGAS_DIR: ${AURORA_CARGAS_DIR:-/app/backend/storage/cargas_bd}
      AURORA_CARGAS_TMP_DIR: ${AURORA_CARGAS_TMP_DIR:-}
      CARGUEBD_ADMIN_ROLES: ${CARGUEBD_ADMIN_ROLES:-admin,carguebd,cargas_bd}
      CARGUEBD_PYTHON: ${CARGUEBD_PYTHON:-python3}
      CARGUEBD_AURORA10_ENABLED: ${CARGUEBD_AURORA10_ENABLED:-true}
      CARGUEBD_SISIPEC_PROCEDURE: ${CARGUEBD_SISIPEC_PROCEDURE:-}
      CARGUEBD_SKIP_ETL: ${CARGUEBD_SKIP_ETL:-false}
      CARGUEBD_MAX_FILE_MB: ${CARGUEBD_MAX_FILE_MB:-120}
      CARGUEBD_PUBLIC_ERROR_MAX_LENGTH: ${CARGUEBD_PUBLIC_ERROR_MAX_LENGTH:-1000}
      CARGUEBD_REPAIR_REGISTRY_ON_START: ${CARGUEBD_REPAIR_REGISTRY_ON_START:-false}
      CARGUEBD_CLEAR_REGISTRY_ON_START: ${CARGUEBD_CLEAR_REGISTRY_ON_START:-false}
      CARGUEBD_ACTUACIONES_CLEANUP_DEFENSOR: ${CARGUEBD_ACTUACIONES_CLEANUP_DEFENSOR:-PRUEBA PILOTO}
    volumes:
      - ./backend/certs:/app/backend/certs:ro
      - aurora_auth_users:/app/backend/storage/auth
      - aurora_cargas_bd:/app/backend/storage/cargas_bd

volumes:
  aurora_auth_users:
  aurora_cargas_bd:
